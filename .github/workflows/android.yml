name: Build Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Signing keys live in the protected "release" environment (main + release tags only).
    # Other branches and pull requests get no environment, no keys, and a debug-signed test build.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && 'release' || '' }}
    permissions:
      contents: write   # only used by the 'Upload to release' step (android-v… tags)
    defaults:
      run:
        working-directory: android
    # Signing secrets only for builds of main and android-v… tags; other branches / PRs use a debug key.
    env:
      KEYSTORE_BASE64: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_KEYSTORE_BASE64 || '' }}
      SEVBY_KEYSTORE_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_KEYSTORE_PASSWORD || '' }}
      SEVBY_KEY_ALIAS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_KEY_ALIAS || '' }}
      SEVBY_KEY_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_KEY_PASSWORD || '' }}
      # New key (Nov 2026 rotation); when set, release APKs carry both keys (see android/sign-rotated.sh)
      NEWKEY_BASE64: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_NEWKEY_BASE64 || '' }}
      NEW_KEY_ALIAS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_NEWKEY_ALIAS || '' }}
      NEW_KEYSTORE_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && secrets.SEVBY_NEWKEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "SEVBY_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            # Test build of the NEXT version: e.g. VERSION 1.0.4 in sevby_app.py -> 1.0.5-dev.<run> (0.10.2-beta -> 0.10.3-dev.<run>).
            # It installs over the 1.0.4 release, and the 1.0.5 release later installs over it.
            # (The internal versionCode is worked out from this name in app/build.gradle.kts.)
            V=$(grep -m1 '^VERSION = ' ../sevby_app.py | sed 's/.*"\(.*\)".*/\1/')
            core=${V%%-*}; IFS=. read -r a b c <<< "$core"
            next="$a.$b.$((c + 1))"
            echo "SEVBY_VERSION_NAME=${next}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Signing key (from repo secrets, if set)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sevby.jks"
            echo "SEVBY_KEYSTORE=$RUNNER_TEMP/sevby.jks" >> "$GITHUB_ENV"
            echo "Signing with the SEVBY release key"
            if [ -z "$NEWKEY_BASE64" ]; then
              # Phones that have the rotated app only accept updates carrying the new key: never ship without it.
              echo "::error::The new signing key (SEVBY_NEWKEY_* in the 'release' environment) is missing."
              exit 1
            fi
            echo "$NEWKEY_BASE64" | base64 -d > "$RUNNER_TEMP/sevby-new.jks"
            echo "NEW_KEYSTORE=$RUNNER_TEMP/sevby-new.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "::error::Release builds need the signing key. Add the SEVBY_KEYSTORE_* secrets first (see android/README.md)."
            exit 1
          else
            echo "::warning::No SEVBY_KEYSTORE_BASE64 secret - APKs are signed with a throwaway debug key (normal for branches other than main). It must be installed after uninstalling SEVBY."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Key rotation (original key for Android 7-8, new key for Android 9+)
        run: |
          OLD_KEYSTORE="${SEVBY_KEYSTORE:-}" OLD_KEY_ALIAS="$SEVBY_KEY_ALIAS" \
          OLD_KEYSTORE_PASSWORD="$SEVBY_KEYSTORE_PASSWORD" OLD_KEY_PASSWORD="$SEVBY_KEY_PASSWORD" \
            bash sign-rotated.sh app/build/outputs/apk/release

      - name: Name the APKs
        run: |
          mkdir -p ../out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release(-unsigned)?\.apk$/\1/')
            cp "$f" "../out/SEVBY-${SEVBY_VERSION_NAME}-${abi}.apk"
          done
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: SEVBY-android-${{ env.SEVBY_VERSION_NAME }}
          path: out/*.apk

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Marked as a pre-release and not "Latest", so the desktop release keeps the Latest badge
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "SEVBY for Android ${SEVBY_VERSION_NAME}" --prerelease --latest=false \
            --notes-file android/RELEASE_NOTES.md
          echo "Uploading to $tag"
          gh release upload "$tag" out/*.apk --clobber
