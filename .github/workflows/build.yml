name: Build SEVBY

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also upload the new builds to the newest release"
        type: boolean
        default: false
  push:
    branches: ["main"]
    tags: ["v*"]
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 03:00 UTC

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Linux: Tk"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Get ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install (always the newest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -U "yt-dlp[default]"

      - name: Get Deno (YouTube's JavaScript engine for yt-dlp), checksum-checked
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, os, re, stat, sys, urllib.request, zipfile
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "SEVBY-CI"}), timeout=120).read()
          target = {"win32": "x86_64-pc-windows-msvc", "darwin": "x86_64-apple-darwin"}.get(sys.platform, "x86_64-unknown-linux-gnu")
          rel = json.loads(get("https://api.github.com/repos/denoland/deno/releases/latest"))
          name = f"deno-{target}.zip"
          asset = next(a for a in rel["assets"] if a["name"] == name)
          data = get(asset["browser_download_url"])
          expected = (asset.get("digest") or "").removeprefix("sha256:")
          if not expected:
              side = next(a for a in rel["assets"] if a["name"] == name + ".sha256sum")
              expected = re.search(r"[0-9a-fA-F]{64}", get(side["browser_download_url"]).decode("utf-8", "replace")).group(0)
          actual = hashlib.sha256(data).hexdigest()
          assert actual.lower() == expected.lower(), f"Deno checksum mismatch: {actual} != {expected}"
          exe = "deno.exe" if sys.platform == "win32" else "deno"
          zipfile.ZipFile(io.BytesIO(data)).extract(exe, ".")
          os.chmod(exe, os.stat(exe).st_mode | stat.S_IEXEC)
          print("Deno", rel["tag_name"], "verified", actual)
          PY

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: SEVBY-${{ runner.os }}
          path: dist/*

  # Monthly (or when you tick "publish" on a manual run): put the fresh builds
  # onto the newest release, replacing the old files. Skipped if any build failed.
  publish:
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each build
        run: |
          for d in artifacts/SEVBY-*; do
            name=$(basename "$d")
            (cd "$d" && zip -r -q "../../$name.zip" .)
          done
          ls -l *.zip

      - name: Replace the files on the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Newest desktop release (Android releases are tagged android-v… and are skipped)
          tag=$(gh release list --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("android-") | not)][0].tagName // empty')
          if [ -z "$tag" ]; then echo "No release found - nothing to update"; exit 1; fi
          echo "Updating release $tag"
          gh release upload "$tag" SEVBY-Windows.zip SEVBY-Linux.zip SEVBY-macOS.zip --clobber
          gh release view "$tag" --json body --jq .body | grep -v '^Last automatic rebuild:' > notes.md || true
          printf '\nLast automatic rebuild: %s (with the newest yt-dlp at that time)\n' "$(date -u +%F)" >> notes.md
          gh release edit "$tag" --notes-file notes.md

  # On a push to main where the app's VERSION has no release yet: publish a GitHub Release
  # tagged v<VERSION> with the three desktop builds attached, using RELEASE_NOTES.md as the body.
  # (CI creates the tag + release; mirrors the Sevbify flow.) Skipped if any build failed.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release (new VERSION, no existing tag)
        id: decide
        run: |
          V=$(grep -m1 '^VERSION = ' sevby_app.py | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "v$V already released - nothing to do"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.go == 'true'
        with:
          path: artifacts
      - name: Zip each build
        if: steps.decide.outputs.go == 'true'
        run: |
          for d in artifacts/SEVBY-*; do
            name=$(basename "$d")
            (cd "$d" && zip -r -q "../../$name.zip" .)
          done
          ls -l *.zip
      - uses: actions/setup-java@v4
        if: steps.decide.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.decide.outputs.go == 'true'
      - name: Load Android signing key (if set)
        if: steps.decide.outputs.go == 'true'
        env:
          SEVBY_KEYSTORE_BASE64: ${{ secrets.SEVBY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SEVBY_KEYSTORE_BASE64" ]; then
            echo "$SEVBY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sevby.jks"
            echo "SEVBY_KEYSTORE=$RUNNER_TEMP/sevby.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SEVBY_KEYSTORE_BASE64 secret - the Android APK is left out of this release."
          fi
      - name: Build signed Android APK (for the all-OS release)
        if: steps.decide.outputs.go == 'true' && env.SEVBY_KEYSTORE != ''
        working-directory: android
        env:
          SEVBY_KEYSTORE_PASSWORD: ${{ secrets.SEVBY_KEYSTORE_PASSWORD }}
          SEVBY_KEY_ALIAS: ${{ secrets.SEVBY_KEY_ALIAS }}
          SEVBY_KEY_PASSWORD: ${{ secrets.SEVBY_KEY_PASSWORD }}
          SEVBY_VERSION_NAME: ${{ steps.decide.outputs.version }}
          SEVBY_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../apks
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release(-unsigned)?\.apk$/\1/')
            cp "$f" "../apks/SEVBY-${SEVBY_VERSION_NAME}-${abi}.apk"
          done
          ls -l ../apks
      - name: Create the release (all OS)
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${{ steps.decide.outputs.version }}"
          [ -f RELEASE_NOTES.md ] || printf 'SEVBY v%s\n' "$V" > RELEASE_NOTES.md
          files=(SEVBY-Windows.zip SEVBY-Linux.zip SEVBY-macOS.zip)
          shopt -s nullglob
          for a in apks/*.apk; do files+=("$a"); done
          gh release create "v$V" --target "$GITHUB_SHA" --title "SEVBY v$V" \
            --notes-file RELEASE_NOTES.md "${files[@]}"
